{{define "login"}}
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Log in - Docker Manager</title>
	<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
	<div class="login-bg">
		<div class="login-blob login-blob-1"></div>
		<div class="login-blob login-blob-2"></div>
	</div>
	<form class="login-card" method="post" action="/login">
		<div class="login-logo">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M22 12.2c-.6-.4-1.9-.5-2.9-.3-.1-.9-.6-1.7-1.4-2.4l-.5-.4-.4.5c-.5.6-.7 1.6-.6 2.4.1.4.2.9.5 1.3-.2.1-.5.3-.7.3H2.4c-.2 1.3 0 2.9.8 4.2 1 1.6 2.6 2.5 4.7 2.5 4.5 0 7.9-2.1 9.4-5.9 1 0 2 0 2.6-.9.1-.1.2-.4.3-.6l.1-.3-.3-.4z" fill="currentColor"/>
				<rect x="3.5" y="9" width="2.1" height="2" fill="currentColor"/>
				<rect x="6.2" y="9" width="2.1" height="2" fill="currentColor"/>
				<rect x="8.9" y="9" width="2.1" height="2" fill="currentColor"/>
				<rect x="6.2" y="6.3" width="2.1" height="2" fill="currentColor"/>
				<rect x="8.9" y="6.3" width="2.1" height="2" fill="currentColor"/>
				<rect x="8.9" y="3.6" width="2.1" height="2" fill="currentColor"/>
				<rect x="11.6" y="9" width="2.1" height="2" fill="currentColor"/>
			</svg>
		</div>
		<h1>Docker Manager</h1>
		<p class="login-subtitle">Sign in to manage your containers</p>
		{{if .Error}}<p class="error login-error">{{.Error}}</p>{{end}}
		<label class="login-field">
			<span>Username</span>
			<div class="input-wrap">
				<svg class="input-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
					<circle cx="10" cy="6.5" r="3.25" stroke="currentColor" stroke-width="1.5"/>
					<path d="M3.5 17c.7-3.2 3.4-5 6.5-5s5.8 1.8 6.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
				</svg>
				<input type="text" name="username" autocomplete="username" required autofocus placeholder="root">
			</div>
		</label>
		<label class="login-field">
			<span>Password</span>
			<div class="input-wrap">
				<svg class="input-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
					<rect x="4" y="9" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/>
					<path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
				</svg>
				<input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
			</div>
		</label>
		<button type="submit">Log in</button>
	</form>
</body>
</html>
{{end}}
